<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phosphor — Ben Voet</title>
  <meta name="description" content="Phosphor: a retro CRT audio visualizer. Oscilloscope, spectrum, spectrogram and phase scope for your microphone, a demo synth or an audio file." />
  <meta name="theme-color" content="#050805" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2315120e'/%3E%3Cpath d='M4 22 L11 8 L11 22 L18 8 L18 22 L25 8' fill='none' stroke='%23ff7a2f' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700;1,800&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/viz.css" />
</head>
<body data-theme="green">
  <div class="room" id="room">
    <header class="top">
      <a class="top__back" href="../">← benvoet.be</a>
      <h1 class="top__title">Phosphor <span>audio visualizer</span></h1>
    </header>

    <main class="monitor" id="monitor">
      <div class="screen" id="screen">
        <canvas id="canvas" aria-label="Audio visualization"></canvas>
        <div class="readout" aria-live="polite">
          <span id="ro-mode">SCOPE</span>
          <span id="ro-note">--</span>
          <span id="ro-src">NO SIGNAL</span>
        </div>

        <!-- Shown until a source is picked -->
        <div class="start" id="start">
          <p class="start__title">Pick a signal</p>
          <div class="start__buttons">
            <button type="button" class="key key--big" data-source="mic">Microphone</button>
            <button type="button" class="key key--big" data-source="demo">Demo synth</button>
            <button type="button" class="key key--big" data-source="file">Audio file</button>
          </div>
          <p class="start__hint">Play guitar into your mic, or drop an audio file anywhere on the page.</p>
          <p class="start__error" id="start-error" hidden></p>
        </div>
      </div>
    </main>

    <section class="panel" id="panel" aria-label="Controls">
      <div class="group" role="group" aria-label="Display mode">
        <span class="group__label">Mode</span>
        <button type="button" class="key is-on" data-mode="scope" title="Oscilloscope (1)">Scope</button>
        <button type="button" class="key" data-mode="spectrum" title="Spectrum (2)">Spectrum</button>
        <button type="button" class="key" data-mode="spectrogram" title="Spectrogram (3)">Waterfall</button>
        <button type="button" class="key" data-mode="phase" title="Phase / XY (4)">Phase</button>
      </div>

      <div class="group" role="group" aria-label="Signal source">
        <span class="group__label">Source</span>
        <button type="button" class="key" data-source="mic">Mic</button>
        <button type="button" class="key" data-source="demo">Demo</button>
        <button type="button" class="key" data-source="file">File</button>
        <button type="button" class="key" id="play" hidden>Pause</button>
      </div>

      <div class="group" role="group" aria-label="Phosphor colour">
        <span class="group__label">Phosphor</span>
        <button type="button" class="swatch is-on" data-theme="green" aria-label="Green"></button>
        <button type="button" class="swatch" data-theme="amber" aria-label="Amber"></button>
        <button type="button" class="swatch" data-theme="blue" aria-label="Blue"></button>
      </div>

      <div class="group group--sliders">
        <label class="slider">
          <span>Gain</span>
          <input type="range" id="gain" min="0.25" max="4" step="0.05" value="1" />
        </label>
        <label class="slider">
          <span>Afterglow</span>
          <input type="range" id="glow" min="0" max="0.95" step="0.01" value="0.75" />
        </label>
        <label class="slider" id="vol-wrap" hidden>
          <span>Volume</span>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.6" />
        </label>
      </div>

      <div class="group">
        <button type="button" class="key" id="fullscreen" title="Fullscreen (F)">Fullscreen</button>
      </div>
    </section>

    <p class="hints">Keys: <b>1–4</b> mode · <b>F</b> fullscreen · <b>Space</b> freeze</p>

    <input type="file" id="file" accept="audio/*" hidden />
  </div>

  <script type="module" src="../js/viz.js"></script>
</body>
</html>
